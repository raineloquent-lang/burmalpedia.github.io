<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BurmalPedia — Выбор темы</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { background: #1a1a2e; color: white; font-family: 'Segoe UI', Arial, sans-serif; min-height: 100vh; display: flex; align-items: center; justify-content: center; }
        .container { text-align: center; padding: 40px 20px; }
        h1 { font-size: 42px; color: #e94560; margin-bottom: 15px; }
        p { color: #ccc; font-size: 18px; margin-bottom: 40px; }
        .cards { display: flex; gap: 25px; flex-wrap: wrap; justify-content: center; }
        .card { background: #16213e; border-radius: 20px; padding: 40px; width: 220px; text-align: center; cursor: pointer; transition: transform 0.3s; text-decoration: none; color: white; }
        .card:hover { transform: scale(1.05); }
        .card .icon { font-size: 60px; margin-bottom: 15px; }
        .card h2 { font-size: 22px; color: #4ecca3; margin-bottom: 10px; }
        .card p { font-size: 13px; color: #ccc; margin-bottom: 0; }
        .back-link { display: block; color: #4ecca3; text-decoration: none; margin-top: 40px; font-size: 14px; }
    </style>
</head>
<body>
    <div class="container">
        <h1>📚 BurmalPedia</h1>
        <p>Выберите интересующую вас тему</p>
        <div class="cards">
            <a href="web-politics.html" class="card">
                <div class="icon">🏛️</div>
                <h2>Политика</h2>
                <p>Обзоры и новости политики</p>
            </a>
            <a href="web-games.html" class="card">
                <div class="icon">🎮</div>
                <h2>Медийность</h2>
                <p>Обзоры медиа индустрии</p>
            </a>
            <a href="web-news.html" class="card">
                <div class="icon">📰</div>
                <h2>Новости</h2>
                <p>Общие новости и события</p>
            </a>
        </div>
        <a href="index.html" class="back-link">← На главную</a>
    </div>
</body>
</html>
